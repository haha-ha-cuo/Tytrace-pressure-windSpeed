[project]
name = "tytrace-fields"
version = "0.1.0"
description = "Export TyTrace pressure and wind fields from NetCDF to compact GeoJSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "netCDF4>=1.7.2",
  "numpy>=2.0",
]

[project.scripts]
tytrace-fields = "tytrace_fields.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
